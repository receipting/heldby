[project]
name = "heldby"
version = "0.1.0"
description = "Find every place AI runs in a codebase, and name what stands between each model's output and a real-world effect."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Managed Functions Pty Ltd" }]
keywords = ["ai", "governance", "audit", "llm", "compliance", "soc2", "ai-register"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0.2"]

[project.urls]
Homepage = "https://github.com/receipting/heldby"
Issues = "https://github.com/receipting/heldby/issues"

[project.scripts]
heldby = "heldby.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heldby"]

[tool.pytest.ini_options]
testpaths = ["tests"]
