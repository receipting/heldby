name: catalog-freshness

# Keeps the detection surface current, unattended.
#
# Catalogue freshness is this tool's single point of failure. A renamed package
# makes it report "no AI detected" over a codebase full of AI, and the failure is
# silent — the report still claims it scanned everything. So this runs nightly
# rather than waiting for someone to notice.
#
# Why it is safe to merge without a person reading it, which is the only
# interesting question here:
#
#   The model proposes.  A script applies.  A gate verifies.
#
# The model never edits the catalogue. It writes a proposals JSON, and
# scripts/apply_proposals.py decides what gets in: additive only, schema-valid,
# and every proposed package name resolved against npm or PyPI. Then
# `heldby catalog --assert-additive` independently re-checks that nothing was
# removed or altered, and the full test suite runs against the fixtures.
#
# The invariant doing the work is that **the catalogue only grows**. A run that
# can only add rules cannot reduce what the tool detects, so the worst outcome is
# a useless rule rather than a new blind spot. Anything that would narrow the
# catalogue fails the gate, gets labelled, and waits for a person — including a
# rename, because the right shape for a rename is to add the new name and keep
# the old one.
#
# The discovery step reads the open web, so web content is treated as data and
# never as instructions. A hostile page's best case is one extra rule for a
# package that genuinely exists, which still has to survive the fixtures and is
# visible in the diff forever.
#
# The pull request is opened with a repo-scoped token of its own rather than the
# job's GITHUB_TOKEN, because a pull request opened by GITHUB_TOKEN starts no
# workflow: GitHub files the ci run as action_required and never dispatches a
# job. The nightly change then merged with the test suite never having run
# against it — the one outcome this whole file is arranged to prevent.

on:
  schedule:
    - cron: "17 14 * * *" # 00:17 AEST
  workflow_dispatch:

# Read-only for the job's own token. Everything that writes — the branch, the
# pull request, the merge — goes through CATALOG_BOT_TOKEN in the last step, so
# no write-capable credential exists in this job while the model is running.
permissions:
  contents: read

concurrency:
  group: catalog-freshness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # An unattended job with a model in it needs a ceiling. Without one the
    # default is six hours, which is a long time to spend discovering nothing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Leave no credential in .git/config. The discovery step below reads
          # the open web, and a token on disk is just a file it can read.
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 1 · Deterministic. No model, no network beyond the two registries.
      #     Runs first so a rename is caught even if the discovery step is skipped.
      - name: Resolve every catalogued package name
        id: registries
        continue-on-error: true
        run: |
          uv run heldby catalog --check-registries --json > /tmp/registries.json
          uv run heldby catalog --check-registries | tee /tmp/registries.txt

      # 2 · The only step that uses a model. Skipped, loudly, without a key —
      #     a fork inherits this workflow and must not fail because of that.
      #
      #     Note what the model is NOT given. No Bash, so nothing it reads on the
      #     web can become a command. No token in its environment, and none on
      #     disk either — the checkout above persists no credential, and the one
      #     token that can write is introduced two steps later, after this step
      #     has finished. It needs none of it: step 1 already wrote the registry
      #     results to /tmp for it to read.
      #     Discovery is allowed to fail. It is the one non-deterministic step, and
      #     the registry check above may already have found a rename worth
      #     shipping — killing the job over a slow model run would throw that away.
      - name: Discovery — new and changed frameworks
        id: discovery
        continue-on-error: true
        timeout-minutes: 12
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          echo '{"proposals": []}' > /tmp/proposals.json
          : > /tmp/summary.md
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "No ANTHROPIC_API_KEY: discovery skipped. The registry check still ran." \
              | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/summary.md
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code
          # Its own budget, under the step timeout, so that overrunning still
          # leaves a summary and a log behind. The step timeout is a hard kill:
          # the first run hit it and destroyed the only evidence of why.
          # Streamed through tee for the same reason — a swallowed log is no log.
          timeout --signal=INT 480 \
            claude -p "$(cat .github/prompts/catalog-discovery.md)" \
              --allowedTools Read Write WebSearch WebFetch \
              --permission-mode acceptEdits 2>&1 | tee /tmp/claude.log \
            || echo "discovery did not finish inside its budget; continuing with no proposals"
          test -s /tmp/summary.md || echo "Discovery produced no usable summary." > /tmp/summary.md

      # 3 · Deterministic gate one. Additive only, schema-valid, packages resolve.
      - name: Apply proposals
        run: uv run python scripts/apply_proposals.py /tmp/proposals.json | tee /tmp/applied.txt

      - name: Anything to ship?
        id: changed
        run: |
          if git diff --quiet -- src/heldby/catalog/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalogue unchanged tonight." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 4 · Deterministic gate two, independent of the applier. Then the tests.
      - name: Gate — additive, loads, and the fixtures still pass
        id: gate
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        run: |
          uv run heldby catalog --assert-additive origin/main
          uv run heldby catalog > /dev/null
          uv run pytest -q

      # 5 · The only step holding a credential that can write, and the first one
      #     to run after the model step has exited.
      #
      #     CATALOG_BOT_TOKEN is a fine-grained token scoped to this repository
      #     alone, with contents:write and pull-requests:write and nothing else.
      #     No workflows permission on purpose: a run that has been reading the
      #     open web all night cannot rewrite the gates that judge it.
      - name: Open the pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATALOG_BOT_TOKEN }}
          GATE: ${{ steps.gate.outcome }}
          DISCOVERY: ${{ steps.discovery.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="catalog/freshness-$(date -u +%Y%m%d)-${RUN_ID}"
          git config user.name "heldby-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          git add src/heldby/catalog/
          git commit -m "catalog: nightly freshness sweep"
          # Pushed to a one-off authenticated URL rather than through `origin`,
          # so the token is never written into .git/config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

          # The body is assembled from files on disk, never interpolated into the
          # shell — the summary is model output and is treated as untrusted text.
          {
            echo "Nightly catalogue freshness sweep."
            echo
            echo "Discovery step: ${DISCOVERY}. Gate: ${GATE}."
            echo
            echo "## What the model proposed"
            echo
            cat /tmp/summary.md 2>/dev/null || echo "_No summary was produced._"
            echo
            echo "## What was applied, and what was dropped"
            echo
            echo '```'
            cat /tmp/applied.txt
            echo '```'
            echo
            echo "## Registry resolution"
            echo
            echo '```'
            cat /tmp/registries.txt
            echo '```'
            echo
            echo "Gate outcome: ${GATE}."
          } > /tmp/body.md

          gh pr create \
            --title "catalog: nightly freshness sweep" \
            --body-file /tmp/body.md \
            --head "$BRANCH" \
            --base main

          if [ "${GATE}" = "success" ]; then
            # --auto, not a straight merge: main requires the `test` check, and
            # that check is still queued at this point. Asking to merge now would
            # be refused. This hands the merge to GitHub, to happen when ci goes
            # green — and to never happen if it does not.
            gh pr merge "$BRANCH" --auto --squash
            echo "Auto-merge armed: additive, catalogue loads, fixtures pass. Merges when ci is green." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr edit "$BRANCH" --add-label "needs-review"
            {
              echo "### Left open for a person"
              echo
              echo "The change did not pass the additive gate, or the fixtures failed."
              echo "A narrowing of the catalogue means something that used to be detected"
              echo "no longer is, and that is not a decision to take unattended."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
